<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screen Share Audio Chat</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>
    <div id="app">
        <!-- Connection Panel -->
        <div id="connectionPanel" class="panel">
            <h1>Screen Share Audio Chat</h1>
            <div class="connection-controls">
                <input type="text" id="roomId" placeholder="Enter Room ID or leave empty to create" />
                <button id="connectBtn">Connect</button>
            </div>
            <div id="status">Disconnected</div>
            <div id="peerId" class="peer-id hidden"></div>
        </div>

        <!-- Main Chat Interface (hidden initially) -->
        <div id="chatInterface" class="hidden">
            <div id="screensContainer">
                <!-- Local Screen Preview -->
                <div class="screen-preview" id="localPreview">
                    <video id="localVideo" autoplay muted></video>
                    <div class="sharing-indicator">
                        <div class="icon">🖥️</div>
                        <div class="text">You are sharing your screen</div>
                    </div>
                    <div class="preview-label">Your Screen</div>
                    <div class="preview-tooltip hidden" id="localTooltip">
                        💡 Minimize this browser window to see your desktop
                    </div>
                </div>

                <!-- Remote Screen Preview -->
                <div class="screen-preview" id="remotePreview">
                    <video id="remoteVideo" autoplay></video>
                    <div class="preview-label">Remote Screen</div>
                </div>
            </div>

            <!-- Fullscreen Overlay -->
            <div id="fullscreenOverlay" class="hidden">
                <video id="fullscreenVideo" autoplay></video>
                <button id="exitFullscreen" class="exit-btn">Exit Fullscreen</button>
            </div>

            <!-- Controls -->
            <div id="controls">
                <button id="toggleAudio" class="control-btn">
                    <span class="icon">🎤</span>
                    <span>Mute</span>
                </button>
                <button id="toggleScreen" class="control-btn">
                    <span class="icon">🖥️</span>
                    <span>Stop Sharing</span>
                </button>
                <button id="disconnectBtn" class="control-btn danger">
                    <span class="icon">📞</span>
                    <span>Disconnect</span>
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
