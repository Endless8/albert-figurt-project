<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC Video Chat</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>📹 WebRTC Video Chat</h1>
        
        <div class="video-container">
            <div class="video-wrapper">
                <h3>Your Video</h3>
                <video id="localVideo" autoplay muted playsinline></video>
            </div>
            <div class="video-wrapper">
                <h3>Remote Video</h3>
                <video id="remoteVideo" autoplay playsinline></video>
            </div>
        </div>
        
        <div class="controls">
            <div class="button-group">
                <button class="primary" onclick="startCamera()">Start Camera</button>
                <button class="warning" onclick="shareScreen()">Share Screen</button>
                <button class="danger" onclick="stopSharing()">Stop Sharing</button>
            </div>
            
            <div class="button-group">
                <button class="success" onclick="createOffer()">Create Offer</button>
                <button class="primary" onclick="createAnswer()">Create Answer</button>
            </div>
            
            <div class="connection-info">
                <h4>Offer/Answer (Copy this to the other peer):</h4>
                <textarea id="offerAnswer" placeholder="Your offer or answer will appear here..."></textarea>
                <button class="primary" onclick="copyToClipboard()">Copy to Clipboard</button>
            </div>
            
            <div class="connection-info">
                <h4>Paste Remote Offer/Answer:</h4>
                <textarea id="remoteOfferAnswer" placeholder="Paste the remote peer's offer or answer here..."></textarea>
                <button class="success" onclick="setRemoteDescription()">Connect</button>
            </div>
            
            <div id="status" class="status disconnected">Status: Disconnected</div>
        </div>
    </div>

    <script>
        let localStream;
        let peerConnection;
        const config = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };
        
        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const statusDiv = document.getElementById('status');
        
        function updateStatus(message, type) {
            statusDiv.textContent = `Status: ${message}`;
            statusDiv.className = `status ${type}`;
        }
        
        async function startCamera() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: true,
                    audio: true
                });
                localVideo.srcObject = localStream;
                updateStatus('Camera started', 'connected');
                
                if (peerConnection) {
                    localStream.getTracks().forEach(track => {
                        peerConnection.addTrack(track, localStream);
                    });
                }
            } catch (err) {
                console.error('Error accessing camera:', err);
                alert('Could not access camera: ' + err.message);
            }
        }
        
        async function shareScreen() {
            try {
                const screenStream = await navigator.mediaDevices.getDisplayMedia({
                    video: true,
                    audio: true
                });
                
                if (localStream) {
                    localStream.getTracks().forEach(track => track.stop());
                }
                
                localStream = screenStream;
                localVideo.srcObject = screenStream;
                updateStatus('Screen sharing active', 'connected');
                
                if (peerConnection) {
                    const videoSender = peerConnection.getSenders().find(s => s.track?.kind === 'video');
                    if (videoSender) {
                        videoSender.replaceTrack(screenStream.getVideoTracks()[0]);
                    }
                }
                
                screenStream.getVideoTracks()[0].onended = () => {
                    updateStatus('Screen sharing stopped', 'disconnected');
                };
            } catch (err) {
                console.error('Error sharing screen:', err);
                alert('Could not share screen: ' + err.message);
            }
        }
        
        function stopSharing() {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localVideo.srcObject = null;
                updateStatus('Sharing stopped', 'disconnected');
            }
        }
        
        function initPeerConnection() {
            peerConnection = new RTCPeerConnection(config);
            
            peerConnection.onicecandidate = event => {
                if (event.candidate === null) {
                    document.getElementById('offerAnswer').value = 
                        JSON.stringify(peerConnection.localDescription);
                }
            };
            
            peerConnection.ontrack = event => {
                remoteVideo.srcObject = event.streams[0];
                updateStatus('Connected', 'connected');
            };
            
            peerConnection.onconnectionstatechange = () => {
                const state = peerConnection.connectionState;
                if (state === 'connected') {
                    updateStatus('Connected', 'connected');
                } else if (state === 'disconnected' || state === 'failed') {
                    updateStatus('Disconnected', 'disconnected');
                } else if (state === 'connecting') {
                    updateStatus('Connecting...', 'connecting');
                }
            };
            
            if (localStream) {
                localStream.getTracks().forEach(track => {
                    peerConnection.addTrack(track, localStream);
                });
            }
        }
        
        async function createOffer() {
            if (!localStream) {
                alert('Please start your camera first!');
                return;
            }
            
            initPeerConnection();
            updateStatus('Creating offer...', 'connecting');
            
            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);
        }
        
        async function createAnswer() {
            const remoteDesc = document.getElementById('remoteOfferAnswer').value;
            if (!remoteDesc) {
                alert('Please paste the remote offer first!');
                return;
            }
            
            if (!localStream) {
                alert('Please start your camera first!');
                return;
            }
            
            initPeerConnection();
            updateStatus('Creating answer...', 'connecting');
            
            await peerConnection.setRemoteDescription(JSON.parse(remoteDesc));
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
        }
        
        async function setRemoteDescription() {
            const remoteDesc = document.getElementById('remoteOfferAnswer').value;
            if (!remoteDesc) {
                alert('Please paste the remote offer/answer!');
                return;
            }
            
            if (!peerConnection) {
                alert('Please create an offer first!');
                return;
            }
            
            updateStatus('Connecting...', 'connecting');
            await peerConnection.setRemoteDescription(JSON.parse(remoteDesc));
        }
        
        function copyToClipboard() {
            const text = document.getElementById('offerAnswer').value;
            if (!text) {
                alert('Nothing to copy!');
                return;
            }
            navigator.clipboard.writeText(text);
            alert('Copied to clipboard!');
        }
    </script>
</body>
</html>
